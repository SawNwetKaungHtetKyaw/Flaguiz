name: flaguiz
description: "Flaguiz:Learning & Quiz"
publish_to: "none"

version: 1.1.3+16

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  webview_flutter: ^4.10.0
  carousel_slider: ^5.1.2
  url_launcher: ^6.3.1
  rive: ^0.14.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  dio: ^5.9.0
  firebase_core: ^4.5.0
  cloud_firestore: ^6.3.0
  just_audio: ^0.10.5
  flutter_launcher_icons: ^0.14.4
  vibration: ^3.1.8
  remixicon: ^4.9.1
  google_mobile_ads: ^8.0.0
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  rxdart: ^0.28.0
  new_version_plus: ^1.0.1
  in_app_purchase: ^3.3.0

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon/app_icon.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/coins/
    - assets/images/app_icon/
    - assets/images/achievements/
    - assets/images/buttons/
    - assets/images/back_key/
    - assets/images/backgrounds/
    - assets/images/others/
    - assets/images/battle/
    - assets/audio/
    - assets/fonts/
    - assets/json/
    - assets/video/
    - assets/animation/

  fonts:
    - family: SupplyCenter
      fonts:
        - asset: assets/fonts/supply_center.ttf
